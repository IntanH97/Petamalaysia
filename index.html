<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jungle Algebra Quest</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1b2a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1b263b;
    }
    canvas {
      background: #000;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: block;
    }
    /* UI Overlay */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(13, 27, 42, 0.85);
      border: 2px solid #e0e1dd;
      border-radius: 12px;
      padding: 8px 16px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .hearts {
      color: #ff4d6d;
      font-size: 20px;
      letter-spacing: 2px;
    }
    /* Controls for Touch Devices */
    .touch-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: none;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .dpad, .action-btns {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .btn {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .btn:active {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0.95);
    }
    .btn-jump {
      width: 70px;
      height: 70px;
      background: rgba(76, 201, 240, 0.4);
      border-color: #4cc9f0;
    }
    /* Modals & Screens */
    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: #1b263b;
      border: 3px solid #415a77;
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      color: #e0e1dd;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .modal-card h2 {
      margin-bottom: 15px;
      color: #76c7c0;
      font-size: 24px;
    }
    .modal-card input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #76c7c0;
      background: #0d1b2a;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    .modal-card button {
      background: #76c7c0;
      color: #0d1b2a;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    .modal-card button:hover {
      background: #52ab98;
    }
    .hidden { display: none !important; }
    
    .question-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    .opt-btn {
      background: #415a77 !important;
      color: white !important;
      margin: 0 !important;
    }
    .opt-btn:hover {
      background: #76c7c0 !important;
      color: #0d1b2a !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Overlay -->
  <div class="hud">
    <div class="hud-box">
      <span>NYAWA:</span>
      <span id="hearts-display" class="hearts">❤️❤️❤️</span>
    </div>
    <div class="hud-box">
      <span>CHECKPOINT: <span id="cp-display" style="color:#76c7c0;">0/10</span></span>
    </div>
    <div class="hud-box">
      <span>SKOR: <span id="score-display" style="color:#ffd166;">0</span></span>
    </div>
    <div class="hud-box">
      <span>MASA: <span id="timer-display" style="color:#ef476f;">00:00</span></span>
    </div>
  </div>

  <!-- Touch Controls -->
  <div id="touch-controls" class="touch-controls">
    <div class="dpad">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="action-btns">
      <div class="btn btn-jump" id="btn-jump">▲</div>
    </div>
  </div>

  <!-- Start Screen Modal -->
  <div id="start-modal" class="modal">
    <div class="modal-card">
      <h2>🌴 JUNGLE ALGEBRA QUEST 🌴</h2>
      <p>Selesaikan 10 cabaran algebra di dalam hutan untuk mencapai penamat!</p>
      <input type="text" id="player-name" placeholder="Masukkan Nama Anda" maxlength="15">
      <button id="start-btn">MULA PENGEMBARAAN</button>
    </div>
  </div>

  <!-- Math Question Modal -->
  <div id="question-modal" class="modal hidden">
    <div class="modal-card">
      <h3 style="color: #ffd166; margin-bottom: 10px;">PINTU CHECKPOINT <span id="q-num">1</span></h3>
      <p id="q-text" style="font-size: 20px; font-weight: bold; margin: 15px 0; color: #fff;"></p>
      <div class="question-options" id="q-options"></div>
    </div>
  </div>

  <!-- Game Over / Victory Modal -->
  <div id="end-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="end-title">TAMAT PERMAINAN</h2>
      <p id="end-message"></p>
      <div style="margin: 20px 0; text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;">
        <p>Pemain: <strong id="end-name" style="color:#fff;">-</strong></p>
        <p>Skor Akhir: <strong id="end-score" style="color:#ffd166;">0</strong></p>
        <p>Masa Diambil: <strong id="end-time" style="color:#ef476f;">00:00</strong></p>
        <p>Status Data: <span id="sync-status" style="color:#76c7c0;">Menghantar ke Google Sheets...</span></p>
      </div>
      <button onclick="location.reload()">MAIN SEMULA</button>
    </div>
  </div>
</div>

<script>
  // -------------------------------------------------------------------------
  // APPS SCRIPT URL INTEGRATION
  // Gantikan URL di bawah dengan URL Web App dari Google Apps Script anda!
  // -------------------------------------------------------------------------
  const SCRIPT_URL = "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI";

  // Audio Synth (Web Audio API)
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'jump') {
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'correct') {
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  // 10 SOALAN ALGEBRA
  const questions = [
    { q: "Selesaikan: x + 5 = 12", opts: ["x = 7", "x = 5", "x = 17", "x = 6"], ans: 0 },
    { q: "Selesaikan: 2x = 16", opts: ["x = 32", "x = 8", "x = 6", "x = 4"], ans: 1 },
    { q: "Selesaikan: 3x - 4 = 11", opts: ["x = 3", "x = 4", "x = 5", "x = 7"], ans: 2 },
    { q: "Selesaikan: x / 4 = 3", opts: ["x = 7", "x = 1", "x = 8", "x = 12"], ans: 3 },
    { q: "Selesaikan: 5x + 2 = 27", opts: ["x = 5", "x = 6", "x = 4", "x = 25"], ans: 0 },
    { q: "Permudahkan: 2x + 4x", opts: ["8x", "6x", "6x²", "24x"], ans: 1 },
    { q: "Jika a = 3, kirakan nilai 4a - 2", opts: ["14", "10", "12", "8"], ans: 1 },
    { q: "Selesaikan: 15 - x = 9", opts: ["x = 24", "x = 5", "x = 6", "x = 7"], ans: 2 },
    { q: "Selesaikan: 4(x + 1) = 20", opts: ["x = 4", "x = 5", "x = 3", "x = 6"], ans: 0 },
    { q: "Selesaikan: 2x + 5 = x + 12", opts: ["x = 17", "x = 6", "x = 7", "x = 8"], ans: 2 }
  ];

  // Game Engine Setup
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const CANVAS_WIDTH = 960;
  const CANVAS_HEIGHT = 540;
  canvas.width = CANVAS_WIDTH;
  canvas.height = CANVAS_HEIGHT;

  function resizeCanvas() {
    const scale = Math.min(window.innerWidth / CANVAS_WIDTH, window.innerHeight / CANVAS_HEIGHT);
    canvas.style.width = (CANVAS_WIDTH * scale) + 'px';
    canvas.style.height = (CANVAS_HEIGHT * scale) + 'px';
    
    // Paparkan kawalan sentuhan jika peranti berlayar sentuh / skrin kecil
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0 || window.innerWidth < 1024) {
      document.getElementById('touch-controls').style.display = 'flex';
    }
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Permainan State Variables
  let playerName = "";
  let lives = 3;
  let score = 0;
  let currentCP = 0;
  let timerInterval = null;
  let secondsElapsed = 0;
  let isGameActive = false;
  let isQuestionActive = false;

  // Key Controls State
  const keys = { left: false, right: false, jump: false };

  // World & Camera Settings
  const WORLD_WIDTH = 6500;
  let cameraX = 0;

  // Watak Utama (Player)
  const player = {
    x: 100,
    y: 300,
    width: 40,
    height: 50,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpStrength: -12.5,
    gravity: 0.55,
    isGrounded: false,
    lastCheckpointX: 100,
    lastCheckpointY: 300
  };

  // Generate Platforms & Checkpoints
  const platforms = [];
  const checkpoints = [];

  function initWorld() {
    platforms.length = 0;
    checkpoints.length = 0;

    // Platform Permulaan
    platforms.push({ x: 0, y: 460, width: 600, height: 80 });

    let currentX = 550;
    for (let i = 0; i < 10; i++) {
      // Jurang gaung
      currentX += 130 + Math.random() * 40;
      
      // Platform utama untuk Checkpoint
      const platWidth = 400 + Math.random() * 100;
      const platY = 380 - (Math.random() * 100);
      platforms.push({ x: currentX, y: platY, width: platWidth, height: 160 });

      // Platform tambahan bertingkat di antara checkpoint
      if (i < 9) {
        platforms.push({ x: currentX + platWidth + 60, y: platY - 60, width: 100, height: 20 });
      }

      // Flag Checkpoint
      checkpoints.push({
        id: i,
        x: currentX + platWidth / 2,
        y: platY - 60,
        width: 30,
        height: 60,
        cleared: false
      });

      currentX += platWidth;
    }

    // Platform Penamat
    platforms.push({ x: currentX + 100, y: 400, width: 500, height: 140 });
  }

  // Keyboard Event Listeners
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if ((e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') && player.isGrounded && isGameActive && !isQuestionActive) {
      player.vy = player.jumpStrength;
      player.isGrounded = false;
      playSound('jump');
    }
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  // Touch Event Handlers
  function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (keyProp === 'jump') {
        if (player.isGrounded && isGameActive && !isQuestionActive) {
          player.vy = player.jumpStrength;
          player.isGrounded = false;
          playSound('jump');
        }
      } else {
        keys[keyProp] = true;
      }
    });
    el.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (keyProp !== 'jump') keys[keyProp] = false;
    });
  }
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-jump', 'jump');

  // Logic Game Loop
  function update() {
    if (!isGameActive || isQuestionActive) return;

    // Horizonal Movement
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx = 0;

    player.x += player.vx;

    // Perlanggaran Sisi Dunia (World Bounds)
    if (player.x < 0) player.x = 0;

    // Vertical Physics
    player.vy += player.gravity;
    player.y += player.vy;
    player.isGrounded = false;

    // Collision Detection dengan Platform
    for (let p of platforms) {
      if (
        player.x + player.width > p.x &&
        player.x < p.x + p.width &&
        player.y + player.height >= p.y &&
        player.y + player.height <= p.y + player.vy + 10 &&
        player.vy >= 0
      ) {
        player.isGrounded = true;
        player.vy = 0;
        player.y = p.y - player.height;
      }
    }

    // Semak Terjatuh Gaung
    if (player.y > CANVAS_HEIGHT + 100) {
      handlePlayerDeath("Terjatuh ke dalam gaung!");
    }

    // Semak Perlanggaran Checkpoint
    for (let cp of checkpoints) {
      if (!cp.cleared && Math.abs(player.x - cp.x) < 40 && Math.abs(player.y - cp.y) < 60) {
        triggerQuestion(cp);
      }
    }

    // Kemaskini Kedudukan Kamera
    cameraX = player.x - CANVAS_WIDTH / 3;
    if (cameraX < 0) cameraX = 0;
  }

  // Paparan Grafik (Render)
  function render() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    ctx.save();
    ctx.translate(-Math.floor(cameraX), 0);

    // Latar Belakang Hutan (Parallax Dynamic Gradient & Decor)
    ctx.fillStyle = '#1b4332';
    ctx.fillRect(cameraX, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Pohon & Daun Latar Belakang
    ctx.fillStyle = '#2d6a4f';
    for (let i = -200; i < WORLD_WIDTH; i += 300) {
      ctx.beginPath();
      ctx.arc(i, 200, 120, 0, Math.PI * 2);
      ctx.fill();
    }

    // Lukis Platform
    for (let p of platforms) {
      // Rumput Atas
      ctx.fillStyle = '#52b788';
      ctx.fillRect(p.x, p.y, p.width, 15);
      // Tanah Bawah
      ctx.fillStyle = '#081c15';
      ctx.fillRect(p.x, p.y + 15, p.width, p.height - 15);
    }

    // Lukis Checkpoints (Bendera)
    for (let cp of checkpoints) {
      ctx.fillStyle = '#d8f3dc';
      ctx.fillRect(cp.x, cp.y, 6, cp.height); // Tiang

      ctx.fillStyle = cp.cleared ? '#76c7c0' : '#ff4d6d';
      ctx.beginPath();
      ctx.moveTo(cp.x + 6, cp.y);
      ctx.lineTo(cp.x + 36, cp.y + 15);
      ctx.lineTo(cp.x + 6, cp.y + 30);
      ctx.fill();
    }

    // Lukis Watak Utama (Explorer Sprite)
    ctx.fillStyle = '#ffd166'; // Badan
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = '#081c15'; // Topi Pengembara
    ctx.fillRect(player.x - 4, player.y - 2, player.width + 8, 8);
    ctx.fillRect(player.x + 6, player.y - 12, player.width - 12, 10);

    ctx.restore();
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  // Pengurusan Soalan & Checkpoint
  function triggerQuestion(cp) {
    isQuestionActive = true;
    const qData = questions[cp.id];
    document.getElementById('q-num').innerText = cp.id + 1;
    document.getElementById('q-text').innerText = qData.q;
    
    const optsContainer = document.getElementById('q-options');
    optsContainer.innerHTML = '';

    qData.opts.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(idx, qData.ans, cp);
      optsContainer.appendChild(btn);
    });

    document.getElementById('question-modal').classList.remove('hidden');
  }

  function checkAnswer(selected, correct, cp) {
    document.getElementById('question-modal').classList.add('hidden');
    isQuestionActive = false;

    if (selected === correct) {
      playSound('correct');
      cp.cleared = true;
      currentCP++;
      score += 100;
      player.lastCheckpointX = cp.x;
      player.lastCheckpointY = cp.y - 40;
      
      document.getElementById('cp-display').innerText = currentCP + "/10";
      document.getElementById('score-display').innerText = score;

      if (currentCP >= 10) {
        endGame(true);
      }
    } else {
      playSound('wrong');
      handlePlayerDeath("Jawapan Salah!");
    }
  }

  function handlePlayerDeath(reason) {
    lives--;
    updateHeartsDisplay();

    if (lives <= 0) {
      endGame(false);
    } else {
      // Respawn ke checkpoint terkini
      player.x = player.lastCheckpointX;
      player.y = player.lastCheckpointY;
      player.vx = 0;
      player.vy = 0;
    }
  }

  function updateHeartsDisplay() {
    let heartsStr = "";
    for (let i = 0; i < 3; i++) {
      heartsStr += (i < lives) ? "❤️" : "🖤";
    }
    document.getElementById('hearts-display').innerText = heartsStr;
  }

  // Pemasa (Timer)
  function startTimer() {
    secondsElapsed = 0;
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `${mins}:${secs}`;
    }, 1000);
  }

  // Tamat Permainan & Penghantaran Data ke Google Sheets
  function endGame(isVictory) {
    isGameActive = false;
    clearInterval(timerInterval);

    const timeStr = document.getElementById('timer-display').innerText;
    document.getElementById('end-modal').classList.remove('hidden');
    document.getElementById('end-name').innerText = playerName;
    document.getElementById('end-score').innerText = score;
    document.getElementById('end-time').innerText = timeStr;

    if (isVictory) {
      document.getElementById('end-title').innerText = "🏆 TAHNIAH! ANDA MENANG! 🏆";
      document.getElementById('end-message').innerText = "Anda berjaya menamatkan semua cabaran Algebra di dalam hutan!";
    } else {
      document.getElementById('end-title').innerText = "💀 GAME OVER 💀";
      document.getElementById('end-message').innerText = "Nyawa anda telah habis! Cubalah lagi.";
    }

    sendDataToGoogleSheets({
      playerName: playerName,
      score: score,
      timeElapsed: timeStr,
      checkpointsCleared: currentCP,
      status: isVictory ? "MENANG" : "GAGAL"
    });
  }

  function sendDataToGoogleSheets(payload) {
    const syncStatus = document.getElementById('sync-status');
    
    if (!SCRIPT_URL || SCRIPT_URL.includes("MASUKKAN_URL")) {
      syncStatus.innerText = "URL Apps Script belum dilaraskan.";
      syncStatus.style.color = "#ffd166";
      return;
    }

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      syncStatus.innerText = "Data berjaya disimpan ke Google Sheets! ✅";
      syncStatus.style.color = "#52b788";
    })
    .catch(err => {
      syncStatus.innerText = "Gagal menghantar data. ❌";
      syncStatus.style.color = "#ff4d6d";
      console.error(err);
    });
  }

  // Mula Permainan
  document.getElementById('start-btn').onclick = () => {
    const nameInput = document.getElementById('player-name').value.trim();
    playerName = nameInput !== "" ? nameInput : "Pengembara";
    
    document.getElementById('start-modal').classList.add('hidden');
    initWorld();
    startTimer();
    isGameActive = true;
  };

  // Mula Enjin Render
  requestAnimationFrame(gameLoop);
</script>

</body>
</html>
